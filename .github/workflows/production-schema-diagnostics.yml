name: Read-only Production Schema Diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-schema-diagnostics
  cancel-in-progress: false

jobs:
  diagnose:
    name: Inspect production database schema (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Validate database URL is configured
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python - <<'PY'
          import os
          import sys
          value = os.environ.get("DATABASE_URL", "").strip()
          if not value:
              print("Required GitHub Actions secret DATABASE_URL is not configured.", file=sys.stderr)
              sys.exit(1)
          if not value.startswith(("postgres://", "postgresql://")):
              print("DATABASE_URL must be a PostgreSQL connection URL.", file=sys.stderr)
              sys.exit(1)
          PY
      - name: Run read-only schema diagnostics
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m scripts.diagnose_database_readiness
