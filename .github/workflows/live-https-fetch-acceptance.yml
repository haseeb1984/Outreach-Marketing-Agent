name: Live HTTPS Fetch Acceptance

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/live-https-fetch-acceptance.yml"
      - "backend/scripts/accept_live_website_fetch.py"
      - "backend/app/services/website_fetch.py"

permissions:
  contents: read

jobs:
  live-https:
    name: Verify proxyless pinned HTTPS transport
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Run real HTTPS acceptance
        run: python scripts/accept_live_website_fetch.py
