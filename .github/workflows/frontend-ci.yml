name: Hostinger Frontend CI

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hostinger-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-package:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check frontend
        run: npm run lint
      - name: Build production frontend
        run: npm run build
      - name: Package Hostinger source ZIP (exclude secrets and build outputs)
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile

          root = Path.cwd()
          output = root.parent / "outreach-marketing-agent-hostinger.zip"
          excluded_dirs = {"node_modules", ".next", ".git", "coverage", "dist", "build", ".turbo"}
          with ZipFile(output, "w", ZIP_DEFLATED) as archive:
              for path in sorted(root.rglob("*")):
                  if not path.is_file():
                      continue
                  relative = path.relative_to(root)
                  if any(part in excluded_dirs for part in relative.parts):
                      continue
                  if path.name.startswith(".env") and path.name != ".env.example":
                      continue
                  archive.write(path, Path("frontend") / relative)
          with ZipFile(output) as archive:
              names = archive.namelist()
              assert "frontend/package.json" in names
              assert "frontend/.env.example" in names
              assert not any(Path(name).name.startswith(".env") and Path(name).name != ".env.example" for name in names)
          print(f"Packaged {len(names)} files into {output.name}")
          PY
      - name: Upload Hostinger ZIP
        uses: actions/upload-artifact@v4
        with:
          name: outreach-marketing-agent-hostinger
          path: outreach-marketing-agent-hostinger.zip
          if-no-files-found: error
          retention-days: 14
