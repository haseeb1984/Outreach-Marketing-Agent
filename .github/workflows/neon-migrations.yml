name: Apply Neon Database Migrations

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type apply to run the pending SQL migrations against the DATABASE_URL secret"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: neon-database-migrations
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply reviewed SQL migrations
    if: ${{ inputs.confirm == 'apply' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Apply pending migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python - <<'PY'
          import os
          import sys
          value = os.environ.get("DATABASE_URL", "")
          if not value.strip():
              print("Required GitHub Actions secret DATABASE_URL is not configured.", file=sys.stderr)
              sys.exit(1)
          if not value.startswith(("postgres://", "postgresql://")):
              print("DATABASE_URL must be a PostgreSQL connection URL.", file=sys.stderr)
              sys.exit(1)
          PY
          python -m app.db.migrations
