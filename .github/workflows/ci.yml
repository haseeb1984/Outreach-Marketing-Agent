name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: oma_test
          POSTGRES_PASSWORD: oma_test
          POSTGRES_DB: oma_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oma_test -d oma_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Run automated tests
        run: python -m pytest -q
      - name: Run PostgreSQL authentication integration tests
        if: matrix.python-version == '3.12'
        env:
          OMA_TEST_DATABASE_URL: postgresql://oma_test:oma_test@127.0.0.1:5432/oma_test
        run: python -m pytest -q tests/test_auth_store_postgres.py
      - name: Audit installed dependencies
        if: matrix.python-version == '3.12'
        run: |
          python -m pip install pip-audit
          pip-audit -r requirements.txt
